<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Set de grabación · Administra el dinero de tu negocio</title>
<link rel="stylesheet" href="assets/fonts/fuentes.css">
<style>
/* ------------------------------------------------------------------
   ESTE ARCHIVO ES EL "SET DE GRABACIÓN".
   Playwright lo abre, llama a seek(segundo) y toma una foto. Por eso NO hay
   transiciones ni animaciones de CSS: todo el movimiento se calcula en el
   script a partir del segundo actual. Así cada fotograma sale siempre igual.
   Puedes abrirlo tú mismo con ?ui=1 para mover la barra y ver cualquier segundo.
------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;
  transition: none !important; animation: none !important; }

:root{
  --crema:#F7F0E4; --crema-2:#EFE3D0; --papel:#FFFBF4;
  --tinta:#2B2018; --tinta-suave:#7A6656;
  --ambar:#E3A03C; --terracota:#C4562F; --verde:#4E7C59; --verde-claro:#9CC0A4;
  --rojo:#B23A2B; --azul:#3E6B8A;
  --sombra: 0 18px 50px rgba(43,32,24,.14), 0 3px 10px rgba(43,32,24,.08);
}

html,body{ width:1920px; height:1080px; overflow:hidden; background:#000; }
body{ font-family:'Inter',system-ui,sans-serif; color:var(--tinta); }

#pelicula{ position:relative; width:1920px; height:1080px; overflow:hidden;
  background: radial-gradient(120% 100% at 20% 10%, #FDF7EC 0%, var(--crema) 45%, var(--crema-2) 100%); }

/* --- capas de acabado: grano de película + viñeta (look documental) --- */
#grano{ position:absolute; inset:-50px; pointer-events:none; opacity:.14; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='r'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='220' height='220' filter='url(%23r)' opacity='.55'/></svg>"); }
#vineta{ position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(75% 65% at 50% 45%, transparent 55%, rgba(60,40,25,.20) 100%); }
#calido{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light;
  background: linear-gradient(115deg, rgba(255,196,120,.35), transparent 45%, rgba(120,70,30,.20)); }

/* --- escenario --- */
#escenario{ position:absolute; inset:0; }
.escena{ position:absolute; inset:0; display:none; will-change:opacity,transform; }
.escena .lienzo{ position:absolute; inset:0; transform-origin:50% 45%; }
.contenido{ position:absolute; left:130px; right:130px; top:120px; bottom:270px; }

/* --- elementos de marca --- */
#marca{ position:absolute; left:130px; top:64px; display:flex; align-items:center; gap:14px;
  font-size:19px; letter-spacing:.16em; text-transform:uppercase; color:var(--tinta-suave); font-weight:600; }
#marca .punto{ width:13px; height:13px; border-radius:50%; background:var(--terracota); }
#capitulo{ position:absolute; right:130px; top:60px; font-size:20px; font-weight:600;
  color:var(--tinta-suave); letter-spacing:.04em; }
#barra-progreso{ position:absolute; left:0; bottom:0; height:6px; background:rgba(43,32,24,.10); width:100%; }
#barra-progreso i{ position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,var(--ambar),var(--terracota)); width:0; }

/* --- subtítulos --- */
#subtitulo{ position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
  max-width:1500px; padding:26px 46px; border-radius:22px; text-align:center;
  background:rgba(31,22,16,.86); color:#FFF6E9; font-size:42px; line-height:1.34; font-weight:500;
  letter-spacing:-.005em; box-shadow:0 20px 50px rgba(31,22,16,.28); opacity:0; }

/* --- tipografía de escena --- */
.titulo{ font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:108px; line-height:1.02;
  letter-spacing:-.02em; color:var(--tinta); }
.titulo.medio{ font-size:84px; }
.titulo.chico{ font-size:66px; }
.lead{ font-size:38px; line-height:1.4; color:var(--tinta-suave); max-width:1100px; margin-top:28px; }
.etiqueta{ display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px;
  font-size:22px; font-weight:600; letter-spacing:.10em; text-transform:uppercase; }
.etiqueta.error{ background:rgba(178,58,43,.12); color:var(--rojo); }
.etiqueta.bien{ background:rgba(78,124,89,.14); color:var(--verde); }
.etiqueta.neutra{ background:rgba(43,32,24,.08); color:var(--tinta-suave); }

/* --- tarjetas --- */
.tarjeta{ background:var(--papel); border-radius:28px; box-shadow:var(--sombra); padding:40px 42px;
  border:1px solid rgba(43,32,24,.06); }
.tarjeta h3{ font-family:'Fraunces',serif; font-size:44px; font-weight:600; line-height:1.1; margin-bottom:16px; }
.tarjeta p{ font-size:28px; line-height:1.45; color:var(--tinta-suave); }
.fila-tarjetas{ display:flex; gap:36px; align-items:stretch; }
.fila-tarjetas .tarjeta{ flex:1; }
.numero{ font-family:'Fraunces',serif; font-size:70px; font-weight:700; color:var(--ambar); line-height:1; margin-bottom:18px; }

/* --- piezas ilustradas --- */
.ilustracion{ position:absolute; inset:0; width:100%; height:100%; }
.moneda{ position:absolute; width:54px; height:54px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #F6CE7A, var(--ambar) 60%, #B9822A);
  box-shadow:0 6px 14px rgba(43,32,24,.22); display:grid; place-items:center;
  font-weight:800; font-size:26px; color:#7A5314; }
.hoja{ background:var(--papel); border-radius:20px; box-shadow:var(--sombra); overflow:hidden; }
.hoja .cab{ background:#F0E6D6; padding:20px 30px; font-size:24px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--tinta-suave); display:flex; justify-content:space-between; }
.hoja .reng{ display:flex; justify-content:space-between; padding:22px 30px; font-size:30px;
  border-top:1px solid rgba(43,32,24,.08); }
.hoja .reng b{ font-variant-numeric:tabular-nums; }
.pos{ color:var(--verde); } .neg{ color:var(--rojo); }

/* --- barra de control opcional (?ui=1) --- */
#ui{ position:fixed; left:0; right:0; bottom:0; display:none; gap:16px; align-items:center;
  padding:14px 24px; background:rgba(20,14,10,.92); color:#fff; font-size:16px; z-index:99; }
#ui input{ flex:1; }
</style>
</head>
<body>

  <div id="escenario"></div>

<div id="ui"><span id="ui-t">0.0s</span><input id="ui-rango" type="range" min="0" max="100" step="0.04" value="0"><span id="ui-esc"></span></div>

    <div class="etiqueta bien" data-linea="1" data-desfase="0.4" data-y="18" style="align-self:flex-start; margin-top:48px">Que tu proyecto no sólo flote: que crezca con solidez</div>

<script>
/* ==================================================================
   MOTOR DE ANIMACIÓN
   No hay reloj interno: TODO se dibuja en función del segundo que se
   pide con seek(t). Playwright pide t = 0, 1/30, 2/30... y fotografía.
   ================================================================== */
const PARAMS = new URLSearchParams(location.search);
const RUTA_TIMELINE = PARAMS.get('tl') || 'salida/completo/timeline.json';
const DUR_ENTRADA = 0.75;   // cuánto tarda un elemento en entrar
const FUNDIDO = 0.55;       // cruce entre una escena y la siguiente

const CAPITULOS = {
  apertura:'Introducción', flujo:'Introducción', agenda:'Introducción',
  pregunta:'Fundamentos', definicion:'Fundamentos', ventajas:'Fundamentos',
  ventaja1:'Fundamentos', ventaja2:'Fundamentos', ventaja3:'Fundamentos',
  'transicion-errores':'Errores comunes', error1:'Errores comunes',
  error2:'Errores comunes', error3:'Errores comunes',
  accion:'Plan de acción', presupuesto:'Plan de acción', pasos:'Plan de acción',
  paso1:'Plan de acción', paso2:'Plan de acción', paso3:'Plan de acción', cierre:'Cierre'
};

const limite01 = x => x < 0 ? 0 : (x > 1 ? 1 : x);
const suave = p => 1 - Math.pow(1 - p, 3);             // arranca rápido, frena suave
const pesos = n => '$' + Math.round(n).toLocaleString('es-MX');

const $escenario = document.getElementById('escenario');
const $subtitulo = document.getElementById('subtitulo');
const $capitulo  = document.getElementById('capitulo');
const $progreso  = document.querySelector('#barra-progreso i');
const $grano     = document.getElementById('grano');

let TL = null;
let instancias = [];
let textoSubActual = null;

/* ---------- las tres ventajas se construyen aquí (misma pieza, 4 escenas) ---------- */
const ICONOS = {
  lupa:  '<circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2L20.5 20.5"/>',
  reloj: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.3 2"/>',
  planta:'<path d="M12 20.5V11"/><path d="M12 12.5C12 8 8.5 5 4.5 4.5 4 9 7 12.5 12 12.5z"/><path d="M12 14c0-3.6 2.8-6 6-6.4.4 3.6-2 6.4-6 6.4z"/>'
};
const VENTAJAS = [
  { icono:'lupa',   titulo:'Claridad y control',     texto:'¿Tu negocio genera valor o sólo movimiento sin ganancias?' },
  { icono:'reloj',  titulo:'Capacidad de reacción',  texto:'Te avisa a tiempo si te estás quedando sin capital.' },
  { icono:'planta', titulo:'Tranquilidad operativa', texto:'Cubres tus compromisos y te enfocas en hacer crecer tu proyecto.' }
];

function construirVentajas(activa) {
  const tarjetas = VENTAJAS.map((v, i) => {
    const esActiva = (i === activa);
    const apagada = (activa >= 0 && !esActiva);
    const entrada = activa < 0 ? (0.6 + i * 0.45) : 0.05;
    return `<div class="tarjeta" data-in="${entrada}" data-y="${activa < 0 ? 40 : 0}"
        style="${esActiva ? 'border:2px solid var(--verde); box-shadow:0 22px 60px rgba(78,124,89,.22);' : ''}
               ${apagada ? 'opacity:1; background:#F3ECE0; box-shadow:none;' : ''}">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none"
           stroke="${esActiva ? 'var(--verde)' : 'var(--tinta-suave)'}" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" style="${apagada ? 'opacity:.5' : ''}">${ICONOS[v.icono]}</svg>
      <h3 style="margin-top:16px; ${apagada ? 'opacity:.5' : ''}">${v.titulo}</h3>
      <p style="${apagada ? 'opacity:.45' : ''}">${v.texto}</p>
    </div>`;
  }).join('');
  const div = document.createElement('div');
  div.innerHTML = `<div class="contenido">
      <h2 class="titulo chico" data-in="0.1" data-y="20">Una administración sana te da <span style="color:var(--verde)">tres grandes ventajas</span>.</h2>
      <div class="fila-tarjetas" style="margin-top:64px">${tarjetas}</div>
    </div>`;
  return div.firstElementChild;
}

/* ---------- movimientos especiales de algunas escenas ---------- */
const MOVIMIENTOS = {
  apertura(local, p, inst) {
    const sol = inst.q('#sol-rayos');
    if (sol) sol.setAttribute('transform', `rotate(${(local * 3.5).toFixed(2)} 250 150)`);
    const letrero = inst.q('#letrero-abierto');
    if (letrero) {
      const e = suave(limite01((local - 1.9) / 0.7));
      letrero.setAttribute('transform', `translate(1560,455) scale(${(0.55 + 0.45 * e).toFixed(3)})`);
      letrero.style.opacity = e.toFixed(3);
    }
    const fig = inst.q('#figura-narrador');
    if (fig) fig.setAttribute('transform', `translate(1400,${(530 + Math.sin(local * 1.05) * 7).toFixed(1)}) scale(0.85)`);
  },

  flujo(local, p, inst) {
    const ventas = [52, 71, 86, 100], utilidad = [16, 19, 15, 18];
    inst.nodo.querySelectorAll('.barra-v').forEach((b, i) => {
      b.style.height = (ventas[i] * suave(limite01((local - 1.9 - i * 0.14) / 0.8))).toFixed(1) + '%';
    });
    inst.nodo.querySelectorAll('.barra-u').forEach((b, i) => {
      b.style.height = (utilidad[i] * suave(limite01((local - 2.5 - i * 0.14) / 0.8))).toFixed(1) + '%';
    });
  },

  pregunta(local, p, inst) {
    const linea = inst.q('#subrayado');
    if (!linea) return;
    const largo = linea.getTotalLength();
    linea.style.strokeDasharray = largo;
    linea.style.strokeDashoffset = (largo * (1 - suave(limite01((local - 0.9) / 1.1)))).toFixed(2);
  },

  error1: viaje('#billete-fuga', 540, 500, 1380, 500, 2.2, 3.6, 150, 1.45),
  error2: (function () {
    const mover = viaje('#producto-regalado', 520, 470, 1125, 500, 3.0, 4.4, 120, 1.15);
    return function (local, p, inst) {
      mover(local, p, inst);
      const total = inst.q('#fuga-total');
      if (total) {
        const desde = (inst.tiempos[2] ?? inst.tiempos[inst.tiempos.length - 1] ?? 0) + 1.6;
        total.textContent = '−' + pesos(615 * suave(limite01((local - desde) / 2.2)));
      }
    };
  })(),

  error3(local, p, inst) {
    const globo = inst.q('#globo-vanidad');
    if (!globo) return;
    const inflado = suave(limite01((local - 1.2) / 3.2));
    const escala = 0.35 + 0.8 * inflado + Math.sin(local * 1.5) * 0.02;
    globo.setAttribute('transform', `translate(1400,${(560 - 26 * inflado).toFixed(1)}) scale(${escala.toFixed(3)})`);
    globo.style.opacity = Math.min(1, inflado * 1.8).toFixed(3);
  }
};

/* Genera un movimiento de "algo que viaja de un punto a otro", en bucle. */
function viaje(selector, x1, y1, x2, y2, empieza, ciclo, altura, escala = 1) {
  return function (local, p, inst) {
    const g = inst.q(selector);
    if (!g) return;
    let u = (local - empieza) / ciclo;
    if (u < 0) { g.style.opacity = 0; return; }
    u -= Math.floor(u);
    const x = x1 + (x2 - x1) * u;
    const y = y1 + (y2 - y1) * u - Math.sin(u * Math.PI) * altura;
    g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(u * 40 - 20).toFixed(1)}) scale(${escala})`);
    g.style.opacity = (Math.min(1, u / 0.12) * Math.min(1, (1 - u) / 0.12)).toFixed(3);
  };
}

/* ---------- construcción de las escenas ---------- */
function crearEscena(esc, lineasEsc) {
  const nodo = document.createElement('div');
  nodo.className = 'escena';
  const lienzo = document.createElement('div');
  lienzo.className = 'lienzo';
  nodo.appendChild(lienzo);

  if (esc.nombre === 'ventajas' || /^ventaja[123]$/.test(esc.nombre)) {
    const activa = esc.nombre === 'ventajas' ? -1 : parseInt(esc.nombre.slice(-1)) - 1;
    lienzo.appendChild(construirVentajas(activa));
  } else {
    const tpl = document.querySelector(`template[data-escena="${esc.nombre}"]`);
    if (tpl) lienzo.appendChild(tpl.content.cloneNode(true));
    else console.warn('Escena sin plantilla:', esc.nombre);
  }

  const dur = esc.fin - esc.inicio;
  const tiempos = lineasEsc.map(l => +(l.inicio - esc.inicio).toFixed(3));

  const arranque = el => {
    let t = null;
    if (el.dataset.in !== undefined) t = parseFloat(el.dataset.in);
    else if (el.dataset.linea !== undefined) {
      const i = Math.min(parseInt(el.dataset.linea), tiempos.length - 1);
      t = (tiempos[i] || 0) + parseFloat(el.dataset.desfase || 0);
    }
    if (t === null) return null;
    // Si la escena es corta (por ejemplo en la versión de 90 s) acercamos los
    // elementos tardíos para que igual alcancen a aparecer.
    return Math.max(0, Math.min(t, dur - 0.9));
  };

  const anims = [];
  lienzo.querySelectorAll('[data-in],[data-linea]').forEach(el => {
    const inicio = arranque(el);
    if (inicio === null) return;
    anims.push({
      el, inicio,
      x: parseFloat(el.dataset.x || 0),
      y: parseFloat(el.dataset.y || 0),
      s: parseFloat(el.dataset.s || 1),
      base: el.style.transform || ''
    });
    el.style.opacity = 0;
  });

  // Los números que "cuentan" heredan el tiempo de la fila donde viven.
  const contadores = [];
  lienzo.querySelectorAll('[data-cuenta]').forEach(el => {
    const padre = el.closest('[data-in],[data-linea]');
    const inicio = padre ? arranque(padre) : 0;
    contadores.push({ el, inicio: (inicio ?? 0) + 0.25, valor: parseFloat(el.dataset.cuenta) });
  });

  $escenario.appendChild(nodo);
  return {
    esc, nodo, lienzo, anims, contadores, tiempos, visible: false,
    dur, mover: MOVIMIENTOS[esc.nombre] || null,
    q: sel => lienzo.querySelector(sel)
  };
}

/* ---------- el corazón: dibujar el segundo t ---------- */
function seek(t) {
  $grano.style.backgroundPosition = `${(Math.floor(t * 9) % 7) * 31}px ${(Math.floor(t * 9) % 5) * 43}px`;
  $progreso.style.width = (100 * limite01(t / TL.duracion)).toFixed(3) + '%';

  let dominante = null, opDominante = -1;

  for (const inst of instancias) {
    const local = t - inst.esc.inicio;
    if (local < -0.05 || local > inst.dur + 0.05) {
      if (inst.visible) { inst.nodo.style.display = 'none'; inst.visible = false; }
      continue;
    }
    if (!inst.visible) { inst.nodo.style.display = 'block'; inst.visible = true; }

    const opacidad = suave(limite01(local / FUNDIDO)) * suave(limite01((inst.dur - local) / 0.5));
    inst.nodo.style.opacity = opacidad.toFixed(4);
    if (opacidad > opDominante) { opDominante = opacidad; dominante = inst; }

    const p = limite01(local / inst.dur);
    inst.lienzo.style.transform = `scale(${(1 + 0.045 * p).toFixed(4)}) translateY(${(-10 * p).toFixed(2)}px)`;

    for (const a of inst.anims) {
      const e = suave(limite01((local - a.inicio) / DUR_ENTRADA));
      a.el.style.opacity = e.toFixed(3);
      a.el.style.transform = `${a.base} translate(${((1 - e) * a.x).toFixed(2)}px, ${((1 - e) * a.y).toFixed(2)}px) scale(${(a.s + (1 - a.s) * e).toFixed(4)})`;
    }
    for (const c of inst.contadores) {
      c.el.textContent = pesos(c.valor * suave(limite01((local - c.inicio) / 1.3)));
    }
    if (inst.mover) inst.mover(local, p, inst);
  }

  if (dominante) $capitulo.textContent = CAPITULOS[dominante.esc.nombre] || '';

  // subtítulo activo
  let sub = null;
  for (const linea of TL.lineas) {
    for (const s of linea.subs) {
      if (t >= s.inicio - 0.15 && t <= s.fin + 0.12) { sub = s; break; }
    }
    if (sub) break;
  }
  if (sub) {
    if (sub.texto !== textoSubActual) { $subtitulo.textContent = sub.texto; textoSubActual = sub.texto; }
    const entra = limite01((t - (sub.inicio - 0.15)) / 0.2);
    const sale = limite01(((sub.fin + 0.12) - t) / 0.2);
    $subtitulo.style.opacity = (suave(entra) * suave(sale)).toFixed(3);
  } else {
    $subtitulo.style.opacity = 0;
  }
}
window.seek = seek;

/* ---------- arranque ---------- */
async function iniciar() {
  TL = await (await fetch(RUTA_TIMELINE, { cache: 'no-store' })).json();
  window.TL = TL;
  for (const esc of TL.escenas) {
    instancias.push(crearEscena(esc, TL.lineas.filter(l => l.escena === esc.nombre)));
  }
  await document.fonts.ready;
  seek(0);
  window.LISTO = true;

  if (PARAMS.get('ui') === '1') {          // modo revisión manual en el navegador
    const ui = document.getElementById('ui');
    const rango = document.getElementById('ui-rango');
    const etiqueta = document.getElementById('ui-t');
    const nombreEsc = document.getElementById('ui-esc');
    ui.style.display = 'flex';
    rango.max = TL.duracion;
    const audio = new Audio(RUTA_TIMELINE.replace('timeline.json', 'narracion.wav'));
    const pintar = t => {
      seek(t); etiqueta.textContent = t.toFixed(1) + 's / ' + TL.duracion.toFixed(0) + 's';
      const e = TL.escenas.find(e => t >= e.inicio && t < e.fin);
      nombreEsc.textContent = e ? e.nombre : '';
    };
    rango.addEventListener('input', () => { audio.currentTime = +rango.value; pintar(+rango.value); });
    document.addEventListener('keydown', ev => {
      if (ev.code !== 'Space') return;
      ev.preventDefault();
      if (audio.paused) { audio.currentTime = +rango.value; audio.play(); bucle(); } else audio.pause();
    });
    const bucle = () => {
      if (audio.paused) return;
      rango.value = audio.currentTime; pintar(audio.currentTime);
      requestAnimationFrame(bucle);
    };
    pintar(0);
  }
}
iniciar();
</script>
</body>
</html>
