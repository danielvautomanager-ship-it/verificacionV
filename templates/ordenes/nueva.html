{% extends "base.html" %}
{% block title %}Nueva OS{% endblock %}
{% block page_title %}Nueva Orden de Servicio{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="chart-card">
      <h6 class="mb-4 pb-2 border-bottom text-primary">
        <i class="bi bi-clipboard-plus me-2"></i>Registrar Nueva Orden de Servicio
      </h6>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tipo de Mantenimiento <span class="text-danger">*</span></label>
            <select name="tipo" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option value="Correctivo">Correctivo</option>
              <option value="Preventivo">Preventivo</option>
              <option value="Predictivo">Predictivo</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Prioridad <span class="text-danger">*</span></label>
            <select name="prioridad" class="form-select" required>
              <option value="Media" selected>Media</option>
              <option value="Baja">Baja</option>
              <option value="Alta">Alta</option>
              <option value="Critica">Critica</option>
            </select>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold">Equipo / Activo <span class="text-danger">*</span></label>
            <select name="equipo_id" class="form-select" required>
              <option value="">Seleccionar equipo...</option>
              {% for eq in equipos %}
                <option value="{{ eq.id }}">{{ eq.codigo }} – {{ eq.nombre }} ({{ eq.area }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Técnico Asignado</label>
            <select name="tecnico_id" class="form-select">
              <option value="">Sin asignar</option>
              {% for tec in tecnicos %}
                <option value="{{ tec.id }}">{{ tec.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Descripción del Problema <span class="text-danger">*</span></label>
            <textarea name="descripcion" class="form-control" rows="3" required
                      placeholder="Describa detalladamente la falla o trabajo a realizar..."></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Observaciones Adicionales</label>
            <textarea name="observaciones" class="form-control" rows="2"
                      placeholder="Información adicional, repuestos estimados, etc."></textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4 pt-2 border-top">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Crear Orden de Servicio
          </button>
          <a href="{{ url_for('ordenes_lista') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
