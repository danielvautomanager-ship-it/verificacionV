{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="chart-card">
      <h6 class="mb-4 pb-2 border-bottom text-primary">
        <i class="bi bi-cpu me-2"></i>{{ titulo }}
      </h6>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Código <span class="text-danger">*</span></label>
            <input type="text" name="codigo" class="form-control" required
                   value="{{ equipo.codigo if equipo else '' }}"
                   {{ 'readonly' if equipo }} placeholder="EQ-001">
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold">Nombre / Descripción <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control" required
                   value="{{ equipo.nombre if equipo else '' }}" placeholder="Nombre del equipo">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Área <span class="text-danger">*</span></label>
            <input type="text" name="area" class="form-control" required
                   value="{{ equipo.area if equipo else '' }}" placeholder="Produccion, Utilidades...">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
            <select name="tipo" class="form-select" required>
              {% for t in ['Compresor','Bomba','Transportador','Generador','Enfriador','Motor','Otro'] %}
                <option value="{{ t }}" {{ 'selected' if equipo and equipo.tipo == t }}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Criticidad</label>
            <select name="criticidad" class="form-select">
              {% for c in ['Baja','Media','Alta','Critica'] %}
                <option value="{{ c }}" {{ 'selected' if equipo and equipo.criticidad == c }}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Estado</label>
            <select name="estado" class="form-select">
              {% for e in ['Operativo','En Mantenimiento','Fuera de Servicio'] %}
                <option value="{{ e }}" {{ 'selected' if equipo and equipo.estado == e }}>{{ e }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4 pt-2 border-top">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
          <a href="{{ url_for('equipos_lista') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
