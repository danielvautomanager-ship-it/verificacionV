{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="chart-card">
      <h6 class="mb-4 pb-2 border-bottom text-primary">
        <i class="bi bi-person-gear me-2"></i>{{ titulo }}
      </h6>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Código <span class="text-danger">*</span></label>
            <input type="text" name="codigo" class="form-control" required
                   value="{{ tecnico.codigo if tecnico else '' }}"
                   {{ 'readonly' if tecnico }} placeholder="TEC-001">
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control" required
                   value="{{ tecnico.nombre if tecnico else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Especialidad <span class="text-danger">*</span></label>
            <select name="especialidad" class="form-select" required>
              {% for e in ['Mecanica','Electrica','Instrumentacion','Soldadura','Civil','Lubricacion'] %}
                <option value="{{ e }}" {{ 'selected' if tecnico and tecnico.especialidad == e }}>{{ e }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Turno <span class="text-danger">*</span></label>
            <select name="turno" class="form-select" required>
              {% for t in ['Mañana','Tarde','Noche','Rotativo'] %}
                <option value="{{ t }}" {{ 'selected' if tecnico and tecnico.turno == t }}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          {% if tecnico %}
          <div class="col-md-6">
            <label class="form-label fw-semibold">Estado</label>
            <select name="activo" class="form-select">
              <option value="1" {{ 'selected' if tecnico.activo }}>Activo</option>
              <option value="0" {{ 'selected' if not tecnico.activo }}>Inactivo</option>
            </select>
          </div>
          {% endif %}
        </div>
        <div class="d-flex gap-2 mt-4 pt-2 border-top">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
          <a href="{{ url_for('tecnicos_lista') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
